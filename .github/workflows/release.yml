name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "${{ github.ref_name }}"
          draft: false
          prerelease: false
          body: |
            ## ${{ github.ref_name }}

            新增阿里云 OSS 与七牛云 OSS 上传能力，完整变更见 CHANGELOG.md。

            ### 本次新增
            - 阿里云 OSS：AliyunProvider::oss()，服务端上传、文件上传、删除、存在性、URL 与 PostObject 直传签名
            - 七牛云 OSS：QiniuProvider::oss()，服务端上传、文件上传、删除、存在性、URL、私有空间下载签名与上传凭证
            - toolkit:doctor 增加 aliyuncs/oss-sdk-php、qiniu/php-sdk 可选依赖检查
            - 可选 SDK 缺失时抛出明确的安装提示

            ### 兼容性
            - PHP >= 8.1
            - Laravel 9.x / 10.x / 11.x / 12.x
            - 命名空间 `Readfly\Laravel`

            ### 安装
            ```bash
            composer require readfly/laravel
            ```

name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "${{ github.ref_name }}"
          draft: false
          prerelease: false
          body: |
            ## ${{ github.ref_name }}

            本版本新增可选 AES-256-GCM payload 加密传输，并修复 Laravel 12 场景下发现的两个运行时问题。完整变更见 CHANGELOG.md。

            ### 新增
            - `PayloadCipher`：AES-256-GCM 加解密
            - `EncryptedPayloadMiddleware`：请求体、GET 查询参数和 JSON 响应加密
            - 支持前端 Web Crypto API 对接
            - 本地 Laravel 12 + Vue 3 website 实测通过

            ### 修复
            - 修复 `RepositoryModule` 将 Carbon / `DateTimeInterface` 值 JSON 编码，导致 datetime cast 解析失败的问题
            - 修复 Laravel 12 FormRequest ValidationException 未进入统一响应的问题
            - 完善 `builder:laravel` 配置初始化与运行时依赖声明

            ### 兼容性
            - PHP >= 8.1
            - Laravel 9.x / 10.x / 11.x / 12.x
            - payload 加密默认关闭，需要显式启用并配置密钥
            - 应用层加密不能替代 HTTPS

            ### 安装
            ```bash
            composer require readfly/laravel
            ```
